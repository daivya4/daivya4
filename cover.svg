<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Daivya Shah — Software Engineer and AI Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070d"/><stop offset="1" stop-color="#0d0b1a"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/>
    <animate attributeName="x1" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  <clipPath id="clip"><rect width="1200" height="420" rx="18"/></clipPath>
</defs>
<style>
  .name{font:800 92px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-3px}
  .role{font:500 30px 'SF Mono','Fira Code',Consolas,'Courier New',monospace;fill:#a5f3fc}
  .cur{animation:blink 1s steps(1) infinite;fill:#8b5cf6}
  .pill{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#d1d5db;letter-spacing:.5px}
  .mono{font:700 54px 'SF Mono',Consolas,monospace;fill:#fff}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:1;r:5}50%{opacity:.35;r:8}}
  .o1{transform-origin:1000px 210px;animation:spin 22s linear infinite}
  .o2{transform-origin:1000px 210px;animation:spinr 34s linear infinite}
  .dot{animation:pulse 1.6s ease-in-out infinite}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="260" cy="120" rx="260" ry="130" fill="#7c3aed" opacity=".55"><animateTransform attributeName="transform" type="translate" values="0,0;120,60;0,0" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="900" cy="330" rx="280" ry="120" fill="#06b6d4" opacity=".40"><animateTransform attributeName="transform" type="translate" values="0,0;-140,-50;0,0" dur="17s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="620" cy="60" rx="200" ry="90" fill="#ec4899" opacity=".28"><animateTransform attributeName="transform" type="translate" values="0,0;-90,90;0,0" dur="20s" repeatCount="indefinite"/></ellipse>
  </g>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect y="-4" width="1200" height="3" fill="#a78bfa" opacity=".18"><animate attributeName="y" values="-4;424" dur="6s" repeatCount="indefinite"/></rect>

  <!-- floating particles -->
  <g fill="#fff">
    <circle cx="140" cy="380" r="1.8" opacity=".5"><animate attributeName="cy" values="400;20" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="400" r="1.4" opacity=".4"><animate attributeName="cy" values="420;10" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="390" r="2" opacity=".5"><animate attributeName="cy" values="410;30" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="400" r="1.5" opacity=".4"><animate attributeName="cy" values="420;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="390" r="1.8" opacity=".5"><animate attributeName="cy" values="410;20" dur="11s" repeatCount="indefinite"/></circle>
  </g>

  <!-- status pill -->
  <rect x="80" y="64" width="300" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/>
  <circle class="dot" cx="102" cy="81" r="5" fill="#34d399"/>
  <text x="118" y="86" class="pill">OPEN TO OPPORTUNITIES · 2027</text>

  <!-- name -->
  <text x="78" y="196" class="name" fill="url(#name)">DAIVYA SHAH</text>

  <!-- rotating roles -->
  <text x="84" y="268" class="role" opacity="0">&gt; Software Engineer<tspan class="cur">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.020;0.220;0.250;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="84" y="268" class="role" opacity="0">&gt; AI Agent Builder<tspan class="cur">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.270;0.470;0.500;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="84" y="268" class="role" opacity="0">&gt; Cloud-Native Backends<tspan class="cur">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.720;0.750;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="84" y="268" class="role" opacity="0">&gt; Full-Stack Developer<tspan class="cur">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.770;0.970;1.000;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- bottom tagline -->
  <text x="84" y="344" class="pill" fill-opacity=".7" style="fill:#9ca3af">BMS College of Engineering  ·  ex-NatWest  ·  ex-Reliance  ·  Bengaluru</text>

  <!-- orbit monogram -->
  <g filter="url(#glow)">
    <g class="o1">
      <circle cx="1000" cy="210" r="112" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round"/>
      <circle cx="1112" cy="210" r="7" fill="#22d3ee"/>
    </g>
    <g class="o2">
      <circle cx="1000" cy="210" r="84" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="40 20 6 20"/>
      <circle cx="1000" cy="126" r="5" fill="#c084fc"/>
    </g>
  </g>
  <circle cx="1000" cy="210" r="56" fill="#0b0b16" stroke="url(#ring)" stroke-width="2"/>
  <text x="1000" y="228" text-anchor="middle" class="mono">DS<tspan fill="#22d3ee">.</tspan></text>
</g>
<rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>